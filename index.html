<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Voice Word Reactive Heart Rate</title>
    <style>
        body {
            margin: 0; overflow: hidden; background: transparent;
            font-family: 'Arial Black', Impact, sans-serif;
            display: flex; align-items: center; justify-content: center; height: 100vh;
        }
        .widget-container { display: flex; align-items: center; gap: 15px; padding: 10px; }
        .heart {
            position: relative; width: 50px; height: 50px; background-color: #ff2a2a;
            transform: rotate(-45deg); box-shadow: 0 0 20px rgba(255, 42, 42, 0.6);
        }
        .heart::before, .heart::after {
            content: ""; position: absolute; width: 50px; height: 50px;
            background-color: #ff2a2a; border-radius: 50%;
        }
        .heart::before { top: -25px; left: 0; }
        .heart::after { left: 25px; top: 0; }
        @keyframes pulse {
            0% { transform: scale(1) rotate(-45deg); }
            30% { transform: scale(1.15) rotate(-45deg); }
            60% { transform: scale(1) rotate(-45deg); }
        }
        .pulse-idle { animation: pulse 0.8s infinite ease-in-out; }
        @keyframes extreme-shake {
            0% { transform: translate(2px, 1px) rotate(-43deg) scale(1.3); }
            20% { transform: translate(-3px, 0px) rotate(-44deg) scale(1.4); }
            40% { transform: translate(1px, -1px) rotate(-43deg) scale(1.4); }
            60% { transform: translate(-3px, 1px) rotate(-47deg) scale(1.4); }
            80% { transform: translate(-1px, -1px) rotate(-46deg) scale(1.3); }
            100% { transform: translate(1px, -2px) rotate(-45deg) scale(1.3); }
        }
        .shake-active { animation: extreme-shake 0.1s infinite; background-color: #ff0055 !important; }
        .shake-active::before, .shake-active::after { background-color: #ff0055 !important; }
        .bpm-text { color: #ffffff; font-size: 42px; text-shadow: 2px 2px 0px #000, -2px -2px 0px #000; width: 180px; }
        .high-bpm { color: #ff0055; text-shadow: 0 0 10px rgba(255,0,85,0.8), 2px 2px 0px #000; }
    </style>
</head>
<body>
    <div class="widget-container">
        <div id="heartElement" class="heart pulse-idle"></div>
        <div id="bpmElement" class="bpm-text">74 BPM</div>
    </div>
    <script>
        const heart = document.getElementById('heartElement');
        const bpmText = document.getElementById('bpmElement');
        let currentBPM = 74; let cooldownTimer = 0;

        // Use built-in browser Speech Recognition
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US';

            recognition.onresult = (event) => {
                // The moment you say a word out loud, it instantly triggers the heart spike
                cooldownTimer = 25; 
            };

            recognition.onend = () => {
                recognition.start(); // Keep listening forever
            };

            recognition.start();
        } else {
            console.error("Speech recognition not supported in this browser environment.");
        }

        // Visual animation update loop
        setInterval(() => {
            if (cooldownTimer > 0) {
                cooldownTimer--;
                currentBPM = Math.floor(Math.random() * (184 - 158 + 1)) + 158;
                bpmText.innerText = currentBPM + " BPM";
                bpmText.classList.add('high-bpm');
                heart.classList.remove('pulse-idle'); heart.classList.add('shake-active');
            } else {
                let targetIdle = Math.floor(Math.random() * (88 - 72 + 1)) + 72;
                currentBPM = Math.floor(currentBPM * 0.85 + targetIdle * 0.15);
                bpmText.innerText = Math.floor(currentBPM) + " BPM";
                if(currentBPM < 100) {
                    bpmText.classList.remove('high-bpm');
                    heart.classList.remove('shake-active'); heart.classList.add('pulse-idle');
                }
            }
        }, 100);
    </script>
</body>
</html>
